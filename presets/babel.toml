# different models, one grid. do they converge on one shared language, does one
# model's dialect win, does the grid split along model lines? eval.py and
# `eval.py --report` break scores, first contact and first text down by model.
base = "../config.toml"
ticks = 60

[mix]
backends = ["opus", "sonnet", "haiku"]
assign = "round_robin"     # or "random", or "blocks" (contiguous rows of one model)

[backends.opus]
kind = "anthropic"
model = "claude-opus-5-5"

[backends.sonnet]
kind = "anthropic"
model = "claude-sonnet-5-5"

[backends.haiku]
kind = "anthropic"
model = "claude-haiku-5-5"

